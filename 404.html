<style>
    /* ======================
   404 PAGE
====================== */
.error-404 {
  min-height: 100vh;
  background: var(--bg-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

.error-container {
  background: var(--card-bg);
  box-shadow: var(--shadow-soft);
  border-radius: 20px;
  padding: 60px 50px;
  text-align: center;
  max-width: 520px;
  width: 100%;
}

.error-container h1 {
  font-size: 120px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 20px;
}

.error-container h2 {
  font-size: 28px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 15px;
}

.error-container p {
  font-size: 16px;
  color: var(--text-secondary);
  margin-bottom: 35px;
}

/* Button */
.btn-primary {
  display: inline-block;
  padding: 14px 34px;
  background: var(--accent);
  color: #fff;
  border-radius: 10px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.3s ease;
}

.btn-primary:hover {
  background: var(--accent-dark);
  transform: translateY(-2px);
}

/* ======================
   RESPONSIVE
====================== */
@media (max-width: 768px) {
  .error-container {
    padding: 40px 25px;
  }

  .error-container h1 {
    font-size: 90px;
  }

  .error-container h2 {
    font-size: 22px;
  }

  .error-container p {
    font-size: 15px;
  }
}

</style>

</head>
<body>


<section class="error-404">
  <div class="error-container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>
      Oops! The page you’re looking for doesn’t exist or was moved.
    </p>
    <a href="index.html" class="btn-primary">Back to Home</a>
  </div>
</section>
