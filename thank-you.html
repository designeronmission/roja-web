<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Roja</title>
  
  <!-- Add your CSS links here (same as contact.html) -->
  <link rel="stylesheet" href="css/icofont.min.css">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <style>
    .thank-you-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .thank-you-card {
      background: white;
      border-radius: 20px;
      padding: 50px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    .thank-you-icon {
      font-size: 80px;
      color: #667eea;
      margin-bottom: 30px;
    }
    
    .thank-you-card h1 {
      color: #333;
      margin-bottom: 20px;
      font-weight: 700;
    }
    
    .thank-you-card p {
      color: #666;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    
    .btn-home {
      background: #667eea;
      color: white;
      padding: 12px 40px;
      border-radius: 50px;
      text-decoration: none;
      display: inline-block;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
    }
    
    .btn-home:hover {
      background: #5a67d8;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="thank-you-section">
    <div class="thank-you-card" data-aos="fade-up">
      <div class="thank-you-icon">
        <i class="icofont-check-alt"></i>
      </div>
      <h1>Thank You!</h1>
      <p>We've received your message and our team will get back to you within 24 hours.</p>
      <p>In the meantime, feel free to explore more about our platform and solutions.</p>
      <a href="index.html" class="btn-home">Back to Home</a>
    </div>
  </div>

  <!-- Optional: Add AOS animation -->
  <link rel="stylesheet" href="css/aos.css">
  <script src="js/aos.js"></script>
  <script>
    AOS.init({
      duration: 1000,
      once: true
    });
  </script>
</body>
</html>
